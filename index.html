<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Blue Whale with Speed Controls</title>
    <!-- นำเข้า A-Frame และ AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- สคริปต์ควบคุมพฤติกรรมการว่ายของปลาวาฬ -->
    <script>
        AFRAME.registerComponent('whale-behavior', {
            init: function() {
                this.speedMultiplier = 1;
                this.orbitAngle = 0;
                this.bobAngle = 0;
                this.tailAngle = 0;
            },
            // ฟังก์ชันสำหรับเปลี่ยนความเร็ว (ถูกเรียกใช้โดยปุ่ม UI)
            setSpeed: function(speed) {
                this.speedMultiplier = speed;
            },
            tick: function(time, timeDelta) {
                let dt = timeDelta / 1000; // แปลงเวลาเป็นวินาที

                // 1. ว่ายวนรอบๆ Marker (Orbit)
                this.orbitAngle -= 30 * this.speedMultiplier * dt; 
                document.querySelector('#swimming-orbit').setAttribute('rotation', `0 ${this.orbitAngle} 0`);

                // 2. เคลื่อนที่ขึ้นและลง (Bobbing)
                this.bobAngle += 2 * Math.PI * (0.4 * this.speedMultiplier) * dt; 
                let yPos = 1.2 + Math.sin(this.bobAngle) * 0.4; 
                document.querySelector('#whale-center').setAttribute('position', `1.5 ${yPos} 0`);

                // 3. สะบัดหาง (Tail Wagging)
                this.tailAngle += 2 * Math.PI * (1.5 * this.speedMultiplier) * dt; 
                let wag = Math.sin(this.tailAngle) * 20; 
                document.querySelector('#whale-tail').setAttribute('rotation', `0 ${wag} 0`);
            }
        });

        // ฟังก์ชันเมื่อกดปุ่มเปลี่ยนความเร็ว
        function changeSpeed(speed, btnElement) {
            let whale = document.querySelector('[whale-behavior]');
            if (whale && whale.components['whale-behavior']) {
                whale.components['whale-behavior'].setSpeed(speed);
            }

            // เปลี่ยนสีปุ่มที่กำลังใช้งานอยู่ (Active State)
            let buttons = document.querySelectorAll('.speed-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }
    </script>

    <style>
        /* สไตล์ของข้อความด้านบน */
        .ui-header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 1000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        h2 { margin: 0; font-size: 24px; }
        p { margin: 5px 0; font-size: 16px; color: #f5ead5; }

        /* สไตล์ของปุ่มปรับความเร็วด้านล่าง */
        .controls-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 18px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .speed-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 10px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .speed-btn:active {
            transform: scale(0.95);
        }

        /* สีปุ่มเมื่อถูกเลือกใช้งาน */
        .speed-btn.active {
            background: #00d2ff;
            color: #002b49;
            border-color: #00d2ff;
            box-shadow: 0 0 12px #00d2ff;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- ข้อความแจ้งเตือนด้านบน -->
    <div class="ui-header">
        <h2>AR วาฬสีน้ำเงิน</h2>
        <p>ส่องกล้องไปที่ Hiro Marker เพื่อดูปลาวาฬ</p>
    </div>

    <!-- แผงปุ่มกดเลือกความเร็วด้านล่าง -->
    <div class="controls-container">
        <button class="speed-btn active" onclick="changeSpeed(1, this)">1 เท่า</button>
        <button class="speed-btn" onclick="changeSpeed(2, this)">2 เท่า</button>
        <button class="speed-btn" onclick="changeSpeed(3, this)">3 เท่า</button>
    </div>

    <!-- สร้าง AR Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="antialias: true">
        
        <a-marker preset="hiro">
            
            <!-- จุดศูนย์กลางสำหรับการหมุนวน (Orbit) -->
            <a-entity id="swimming-orbit">
                
                <!-- ตำแหน่งปลาวาฬ (ลอยขึ้นและห่างออกจากจุดศูนย์กลาง) -->
                <a-entity id="whale-center" position="1.5 1.2 0">
                    
                    <!-- โครงสร้างตัวปลาวาฬทั้งหมด -->
                    <a-entity id="whale-model" whale-behavior>

                        <!-- ส่วนลำตัวบน (สีน้ำเงินเข้มอ้างอิงจากรูป) -->
                        <a-sphere position="0 0 0" scale="0.4 0.5 1.2" color="#10305a"></a-sphere>
                        
                        <!-- ส่วนท้อง (สีครีมอ่อน) -->
                        <a-sphere position="0 -0.12 0" scale="0.38 0.35 1.15" color="#f5ead5"></a-sphere>

                        <!-- ดวงตาซ้ายและขวา -->
                        <a-sphere position="0.35 0.1 -0.6" radius="0.04" color="#000000"></a-sphere>
                        <a-sphere position="-0.35 0.1 -0.6" radius="0.04" color="#000000"></a-sphere>

                        <!-- ครีบข้าง (Flippers) -->
                        <a-cone position="-0.35 -0.1 -0.3" rotation="-20 0 50" radius-bottom="0.1" radius-top="0" height="0.9" color="#10305a"></a-cone>
                        <a-cone position="0.35 -0.1 -0.3" rotation="-20 0 -50" radius-bottom="0.1" radius-top="0" height="0.9" color="#10305a"></a-cone>

                        <!-- ส่วนหางที่ขยับได้ (Tail Joint) -->
                        <a-entity id="whale-tail" position="0 0 0.9">
                            <!-- โคนหาง -->
                            <a-cone position="0 0 0.3" rotation="-90 0 0" radius-bottom="0.25" radius-top="0.05" height="0.8" color="#10305a"></a-cone>
                            <!-- ปลายหางแฉก (Flukes) -->
                            <a-sphere position="0.35 0 0.7" rotation="0 -25 0" scale="0.4 0.05 0.2" color="#10305a"></a-sphere>
                            <a-sphere position="-0.35 0 0.7" rotation="0 25 0" scale="0.4 0.05 0.2" color="#10305a"></a-sphere>
                        </a-entity>

                        <!-- จุดสีขาวบนหลัง (White Spots) -->
                        <a-sphere position="0.1 0.45 -0.2" radius="0.015" color="#ffffff"></a-sphere>
                        <a-sphere position="-0.15 0.48 0.1" radius="0.012" color="#ffffff"></a-sphere>
                        <a-sphere position="0.2 0.46 0.3" radius="0.015" color="#ffffff"></a-sphere>
                        <a-sphere position="-0.05 0.49 -0.4" radius="0.012" color="#ffffff"></a-sphere>
                        <a-sphere position="0.22 0.38 0.6" radius="0.015" color="#ffffff"></a-sphere>
                        <a-sphere position="-0.18 0.42 0.5" radius="0.012" color="#ffffff"></a-sphere>
                        <a-sphere position="0 0.48 0" radius="0.01" color="#ffffff"></a-sphere>
                        
                    </a-entity>
                </a-entity>
            </a-entity>

        </a-marker>

        <!-- กล้อง AR -->
        <a-entity camera></a-entity>
        
    </a-scene>
</body>
</html>
