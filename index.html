<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Blue Whale</title>
    <!-- นำเข้า A-Frame และ AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- สคริปต์ควบคุมพฤติกรรมและการแตะหน้าจอของปลาวาฬ -->
    <script>
        AFRAME.registerComponent('whale-behavior', {
            init: function() {
                this.speedMultiplier = 1;
                this.orbitAngle = 0;
                this.bobAngle = 0;
                this.tailAngle = 0;

                // เมื่อคลิกหรือแตะที่ตัวปลาวาฬ ให้เพิ่มความเร็ว
                this.el.addEventListener('click', () => {
                    this.speedMultiplier += 1;
                    if(this.speedMultiplier > 3) {
                        this.speedMultiplier = 1; // วนกลับมาความเร็วปกติ
                    }
                    
                    // อัปเดตข้อความบนหน้าจอ
                    let speedText = this.speedMultiplier === 1 ? "ปกติ" : (this.speedMultiplier === 2 ? "เร็ว" : "เร็วมาก!");
                    document.getElementById('speed-status').innerText = "ความเร็ว: " + speedText;
                });
            },
            tick: function(time, timeDelta) {
                let dt = timeDelta / 1000; // แปลงเวลาเป็นวินาที

                // 1. ว่ายวนรอบๆ Marker (Orbit)
                this.orbitAngle -= 30 * this.speedMultiplier * dt; // องศาต่อวินาที
                document.querySelector('#swimming-orbit').setAttribute('rotation', `0 ${this.orbitAngle} 0`);

                // 2. เคลื่อนที่ขึ้นและลง (Bobbing)
                this.bobAngle += 2 * Math.PI * (0.4 * this.speedMultiplier) * dt; 
                let yPos = 1.2 + Math.sin(this.bobAngle) * 0.4; // แกว่งขึ้นลงระหว่าง 0.8 ถึง 1.6
                document.querySelector('#whale-center').setAttribute('position', `1.5 ${yPos} 0`);

                // 3. สะบัดหาง (Tail Wagging)
                this.tailAngle += 2 * Math.PI * (1.5 * this.speedMultiplier) * dt; 
                let wag = Math.sin(this.tailAngle) * 20; // สะบัดหางซ้ายขวา +/- 20 องศา
                document.querySelector('#whale-tail').setAttribute('rotation', `0 ${wag} 0`);
            }
        });
    </script>

    <style>
        .ui-container {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 1000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none; /* ไม่ให้ UI บังการทัช */
        }
        h2 { margin: 0; font-size: 24px; }
        p { margin: 5px 0; font-size: 16px; color: #f5ead5; }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- UI แจ้งเตือนผู้ใช้บนหน้าจอ -->
    <div class="ui-container">
        <h2>AR วาฬสีน้ำเงิน</h2>
        <p>ส่องกล้องไปที่ Hiro Marker</p>
        <p>👆 แตะที่ตัววาฬเพื่อเพิ่มความเร็วในการว่ายน้ำ!</p>
        <p id="speed-status" style="color: #00ffcc; font-weight: bold;">ความเร็ว: ปกติ</p>
    </div>

    <!-- สร้าง AR Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="antialias: true">
        
        <a-marker preset="hiro">
            
            <!-- จุดศูนย์กลางสำหรับการหมุนวน (Orbit) -->
            <a-entity id="swimming-orbit">
                
                <!-- ตำแหน่งปลาวาฬ (ลอยขึ้นและห่างออกจากจุดศูนย์กลาง) -->
                <a-entity id="whale-center" position="1.5 1.2 0">
                    
                    <!-- โครงสร้างตัวปลาวาฬทั้งหมด -->
                    <a-entity id="whale-model" class="clickable" whale-behavior>
                        
                        <!-- Hitbox ล่องหนที่ใหญ่กว่าตัววาฬ เพื่อให้ผู้ใช้แตะโดนได้ง่ายขึ้น -->
                        <a-sphere radius="1.2" material="opacity: 0; transparent: true"></a-sphere>

                        <!-- ส่วนลำตัวบน (สีน้ำเงินเข้มอ้างอิงจาก whale.jpg) -->
                        <a-sphere position="0 0 0" scale="0.4 0.5 1.2" color="#10305a"></a-sphere>
                        
                        <!-- ส่วนท้อง (สีครีมอ่อน) -->
                        <a-sphere position="0 -0.12 0" scale="0.38 0.35 1.15" color="#f5ead5"></a-sphere>

                        <!-- ดวงตาซ้ายและขวา -->
                        <a-sphere position="0.35 0.1 -0.6" radius="0.04" color="#000000"></a-sphere>
                        <a-sphere position="-0.35 0.1 -0.6" radius="0.04" color="#000000"></a-sphere>

                        <!-- ครีบข้าง (Flippers) -->
                        <!-- ครีบซ้าย -->
                        <a-cone position="-0.35 -0.1 -0.3" rotation="-20 0 50" radius-bottom="0.1" radius-top="0" height="0.9" color="#10305a"></a-cone>
                        <!-- ครีบขวา -->
                        <a-cone position="0.35 -0.1 -0.3" rotation="-20 0 -50" radius-bottom="0.1" radius-top="0" height="0.9" color="#10305a"></a-cone>

                        <!-- ส่วนหางที่ขยับได้ (Tail Joint) -->
                        <a-entity id="whale-tail" position="0 0 0.9">
                            <!-- โคนหาง -->
                            <a-cone position="0 0 0.3" rotation="-90 0 0" radius-bottom="0.25" radius-top="0.05" height="0.8" color="#10305a"></a-cone>
                            <!-- ปลายหางแฉก (Flukes) -->
                            <a-sphere position="0.35 0 0.7" rotation="0 -25 0" scale="0.4 0.05 0.2" color="#10305a"></a-sphere>
                            <a-sphere position="-0.35 0 0.7" rotation="0 25 0" scale="0.4 0.05 0.2" color="#10305a"></a-sphere>
                        </a-entity>

                        <!-- จุดสีขาวบนหลัง (White Spots) -->
                        <a-sphere position="0.1 0.45 -0.2" radius="0.015" color="#ffffff"></a-sphere>
                        <a-sphere position="-0.15 0.48 0.1" radius="0.012" color="#ffffff"></a-sphere>
                        <a-sphere position="0.2 0.46 0.3" radius="0.015" color="#ffffff"></a-sphere>
                        <a-sphere position="-0.05 0.49 -0.4" radius="0.012" color="#ffffff"></a-sphere>
                        <a-sphere position="0.22 0.38 0.6" radius="0.015" color="#ffffff"></a-sphere>
                        <a-sphere position="-0.18 0.42 0.5" radius="0.012" color="#ffffff"></a-sphere>
                        <a-sphere position="0 0.48 0" radius="0.01" color="#ffffff"></a-sphere>
                        
                    </a-entity>
                </a-entity>
            </a-entity>

        </a-marker>

        <!-- กล้อง AR รองรับการสัมผัส (Tap) ผ่านหน้าจอมือถือโดยตรง -->
        <a-entity camera>
            <a-entity cursor="rayOrigin: mouse;" raycaster="objects: .clickable"></a-entity>
        </a-entity>
        
    </a-scene>
</body>
</html>
