<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>AR 3 Whales - Forward Swimming</title>
    
    <!-- นำเข้า A-Frame และ AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
        // ควบคุมพฤติกรรมการว่ายของปลาวาฬทั้ง 3 ตัว
        AFRAME.registerComponent('whales-controller', {
            init: function() {
                this.speedMultiplier = 1;
                this.orbitAngle = 0;
                this.bobAngle = 0;
                this.tailAngle = 0;
            },
            setSpeed: function(speed) {
                this.speedMultiplier = speed;
            },
            tick: function(time, timeDelta) {
                let dt = timeDelta / 1000;

                // 1. ว่ายวนรอบ Marker
                this.orbitAngle += 30 * this.speedMultiplier * dt; 
                let orbit = document.querySelector('#swimming-orbit');
                if(orbit) orbit.setAttribute('rotation', `0 ${this.orbitAngle} 0`);

                // 2. เคลื่อนที่ขึ้นลง (พร้อมกันทั้ง 3 ตัว)
                this.bobAngle += 2 * Math.PI * (0.4 * this.speedMultiplier) * dt; 
                let yPos = 1.2 + Math.sin(this.bobAngle) * 0.4; 
                let centers = document.querySelectorAll('.whale-center');
                centers.forEach(center => {
                    center.setAttribute('position', `1.5 ${yPos} 0`);
                });

                // 3. สะบัดหาง (พร้อมกันทั้ง 3 ตัว)
                this.tailAngle += 2 * Math.PI * (1.5 * this.speedMultiplier) * dt; 
                let wag = Math.sin(this.tailAngle) * 20; 
                let tails = document.querySelectorAll('.whale-tail');
                tails.forEach(tail => {
                    tail.setAttribute('rotation', `0 ${wag} 0`);
                });
            }
        });

        // ฟังก์ชันรับคำสั่งจากปุ่ม UI
        function changeSpeed(speed, btnElement) {
            let ctrl = document.querySelector('[whales-controller]');
            if (ctrl && ctrl.components['whales-controller']) {
                ctrl.components['whales-controller'].setSpeed(speed);
            }

            // อัปเดตสีปุ่ม
            let buttons = document.querySelectorAll('.speed-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }
    </script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }

        .ui-header {
            position: fixed; 
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 99999; 
            color: white;
            font-family: sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
            pointer-events: none; 
        }
        .ui-header h2 { margin: 0; font-size: 24px; }
        .ui-header p { margin: 5px 0; font-size: 16px; color: #f5ead5; }

        .controls-container {
            position: fixed; 
            bottom: 40px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999; 
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: auto; 
        }

        .speed-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 10px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent; 
        }

        .speed-btn.active {
            background: #00d2ff;
            color: #002b49;
            border-color: #00d2ff;
            box-shadow: 0 0 15px #00d2ff;
        }
    </style>
</head>
<body>

    <!-- UI ข้อความด้านบน -->
    <div class="ui-header">
        <h2>AR วาฬ 3 สี</h2>
        <p>ส่องกล้องไปที่ Hiro Marker</p>
    </div>

    <!-- UI ปุ่มควบคุมความเร็วด้านล่าง -->
    <div class="controls-container">
        <button class="speed-btn active" onclick="changeSpeed(1, this)">1 เท่า</button>
        <button class="speed-btn" onclick="changeSpeed(2, this)">2 เท่า</button>
        <button class="speed-btn" onclick="changeSpeed(3, this)">3 เท่า</button>
    </div>

    <!-- สร้าง AR Scene และผูก Script คุมปลาวาฬทั้งหมด -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="antialias: true" vr-mode-ui="enabled: false" whales-controller>
        
        <a-marker preset="hiro">
            
            <a-entity id="swimming-orbit">
                
                <!-- ============================================== -->
                <!-- วาฬตัวที่ 1: สีน้ำเงิน (ตำแหน่ง 0 องศา) -->
                <!-- ============================================== -->
                <a-entity rotation="0 0 0">
                    <!-- เล็กลง 3 เท่าด้วย scale="0.33 0.33 0.33" -->
                    <a-entity class="whale-center" position="1.5 1.2 0" scale="0.33 0.33 0.33">
                        <a-sphere position="0 0 0" scale="0.4 0.5 1.2" color="#10305a"></a-sphere>
                        <a-sphere position="0 -0.12 0" scale="0.38 0.35 1.15" color="#f5ead5"></a-sphere>
                        <a-sphere position="0.35 0.1 -0.6" radius="0.04" color="#000000"></a-sphere>
                        <a-sphere position="-0.35 0.1 -0.6" radius="0.04" color="#000000"></a-sphere>
                        <a-cone position="-0.35 -0.1 -0.3" rotation="-20 0 50" radius-bottom="0.1" radius-top="0" height="0.9" color="#10305a"></a-cone>
                        <a-cone position="0.35 -0.1 -0.3" rotation="-20 0 -50" radius-bottom="0.1" radius-top="0" height="0.9" color="#10305a"></a-cone>
                        <a-entity class="whale-tail" position="0 0 0.9">
                            <a-cone position="0 0 0.3" rotation="-90 0 0" radius-bottom="0.25" radius-top="0.05" height="0.8" color="#10305a"></a-cone>
                            <a-sphere position="0.35 0 0.7" rotation="0 -25 0" scale="0.4 0.05 0.2" color="#10305a"></a-sphere>
                            <a-sphere position="-0.35 0 0.7" rotation="0 25 0" scale="0.4 0.05 0.2" color="#10305a"></a-sphere>
                        </a-entity>
                        <!-- White Spots -->
                        <a-sphere position="0.1 0.45 -0.2" radius="0.015" color="#ffffff"></a-sphere>
                        <a-sphere position="-0.15 0.48 0.1" radius="0.012" color="#ffffff"></a-sphere>
                        <a-sphere position="0.2 0.46 0.3" radius="0.015" color="#ffffff"></a-sphere>
                        <a-sphere position="-0.05 0.49 -0.4" radius="0.012" color="#ffffff"></a-sphere>
                        <a-sphere position="0.22 0.38 0.6" radius="0.015" color="#ffffff"></a-sphere>
                        <a-sphere position="-0.18 0.42 0.5" radius="0.012" color="#ffffff"></a-sphere>
                        <a-sphere position="0 0.48 0" radius="0.01" color="#ffffff"></a-sphere>
                    </a-entity>
                </a-entity>

                <!-- ============================================== -->
                <!-- วาฬตัวที่ 2: สีแดงทับทิม (ตำแหน่งห่างไป 120 องศา) -->
                <!-- ============================================== -->
                <a-entity rotation="0 120 0">
                    <a-entity class="whale-center" position="1.5 1.2 0" scale="0.33 0.33 0.33">
                        <a-sphere position="0 0 0" scale="0.4 0.5 1.2" color="#900C3F"></a-sphere>
                        <a-sphere position="0 -0.12 0" scale="0.38 0.35 1.15" color="#f5ead5"></a-sphere>
                        <a-sphere position="0.35 0.1 -0.6" radius="0.04" color="#000000"></a-sphere>
                        <a-sphere position="-0.35 0.1 -0.6" radius="0.04" color="#000000"></a-sphere>
                        <a-cone position="-0.35 -0.1 -0.3" rotation="-20 0 50" radius-bottom="0.1" radius-top="0" height="0.9" color="#900C3F"></a-cone>
                        <a-cone position="0.35 -0.1 -0.3" rotation="-20 0 -50" radius-bottom="0.1" radius-top="0" height="0.9" color="#900C3F"></a-cone>
                        <a-entity class="whale-tail" position="0 0 0.9">
                            <a-cone position="0 0 0.3" rotation="-90 0 0" radius-bottom="0.25" radius-top="0.05" height="0.8" color="#900C3F"></a-cone>
                            <a-sphere position="0.35 0 0.7" rotation="0 -25 0" scale="0.4 0.05 0.2" color="#900C3F"></a-sphere>
                            <a-sphere position="-0.35 0 0.7" rotation="0 25 0" scale="0.4 0.05 0.2" color="#900C3F"></a-sphere>
                        </a-entity>
                        <!-- White Spots -->
                        <a-sphere position="0.1 0.45 -0.2" radius="0.015" color="#ffffff"></a-sphere>
                        <a-sphere position="-0.15 0.48 0.1" radius="0.012" color="#ffffff"></a-sphere>
                        <a-sphere position="0.2 0.46 0.3" radius="0.015" color="#ffffff"></a-sphere>
                        <a-sphere position="-0.05 0.49 -0.4" radius="0.012" color="#ffffff"></a-sphere>
                        <a-sphere position="0.22 0.38 0.6" radius="0.015" color="#ffffff"></a-sphere>
                        <a-sphere position="-0.18 0.42 0.5" radius="0.012" color="#ffffff"></a-sphere>
                        <a-sphere position="0 0.48 0" radius="0.01" color="#ffffff"></a-sphere>
                    </a-entity>
                </a-entity>

                <!-- ============================================== -->
                <!-- วาฬตัวที่ 3: สีเขียวมรกต (ตำแหน่งห่างไป 240 องศา) -->
                <!-- ============================================== -->
                <a-entity rotation="0 240 0">
                    <a-entity class="whale-center" position="1.5 1.2 0" scale="0.33 0.33 0.33">
                        <a-sphere position="0 0 0" scale="0.4 0.5 1.2" color="#005b4f"></a-sphere>
                        <a-sphere position="0 -0.12 0" scale="0.38 0.35 1.15" color="#f5ead5"></a-sphere>
                        <a-sphere position="0.35 0.1 -0.6" radius="0.04" color="#000000"></a-sphere>
                        <a-sphere position="-0.35 0.1 -0.6" radius="0.04" color="#000000"></a-sphere>
                        <a-cone position="-0.35 -0.1 -0.3" rotation="-20 0 50" radius-bottom="0.1" radius-top="0" height="0.9" color="#005b4f"></a-cone>
                        <a-cone position="0.35 -0.1 -0.3" rotation="-20 0 -50" radius-bottom="0.1" radius-top="0" height="0.9" color="#005b4f"></a-cone>
                        <a-entity class="whale-tail" position="0 0 0.9">
                            <a-cone position="0 0 0.3" rotation="-90 0 0" radius-bottom="0.25" radius-top="0.05" height="0.8" color="#005b4f"></a-cone>
                            <a-sphere position="0.35 0 0.7" rotation="0 -25 0" scale="0.4 0.05 0.2" color="#005b4f"></a-sphere>
                            <a-sphere position="-0.35 0 0.7" rotation="0 25 0" scale="0.4 0.05 0.2" color="#005b4f"></a-sphere>
                        </a-entity>
                        <!-- White Spots -->
                        <a-sphere position="0.1 0.45 -0.2" radius="0.015" color="#ffffff"></a-sphere>
                        <a-sphere position="-0.15 0.48 0.1" radius="0.012" color="#ffffff"></a-sphere>
                        <a-sphere position="0.2 0.46 0.3" radius="0.015" color="#ffffff"></a-sphere>
                        <a-sphere position="-0.05 0.49 -0.4" radius="0.012" color="#ffffff"></a-sphere>
                        <a-sphere position="0.22 0.38 0.6" radius="0.015" color="#ffffff"></a-sphere>
                        <a-sphere position="-0.18 0.42 0.5" radius="0.012" color="#ffffff"></a-sphere>
                        <a-sphere position="0 0.48 0" radius="0.01" color="#ffffff"></a-sphere>
                    </a-entity>
                </a-entity>

            </a-entity>

        </a-marker>

        <!-- กล้อง AR -->
        <a-entity camera></a-entity>
        
    </a-scene>
</body>
</html>
